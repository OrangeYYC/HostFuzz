# HostFuzz demo case: BTstack SM pairing central (BlueKitchen, user-mode QEMU)
# Paper mapping: RQ1 (fuzzing effectiveness) / RQ3 (ablation case 01).
fuzzer:
  work_dir: "./fuzz"

simulator:
  transport: "uart@/tmp/hostfuzz_btstack_01"
  protocol: "h4"
  timeout: 1000
  initial_timeout: 60000
  legacy_scan_reports:
    - event_type: 0
      address_type: Public
      address: [161, 162, 163, 164, 165, 166]
      # Flags + Incomplete List of 16-bit Service UUIDs: 0x1111
      data: [2, 1, 6, 3, 2, 17, 17]
      rssi: -40
  max_att_profile_guided_probe_steps: 0
  ablation:
    record_telemetry: true
    telemetry_dir: "./telemetry"

executor:
  elf_path: "./target.elf"
  cmd_args: []
  chroot_path: ~
  env:
    BTSTACK_UART_DEVICE: "/tmp/hostfuzz_btstack_01"
