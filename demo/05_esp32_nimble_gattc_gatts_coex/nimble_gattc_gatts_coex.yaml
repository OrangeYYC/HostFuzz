# HostFuzz demo case: ESP32 NimBLE GATT client/server coexistence (system-mode QEMU)
# Paper mapping: RQ1 (fuzzing effectiveness) / RQ3 (ablation case 07).
fuzzer:
  work_dir: "./fuzz"

simulator:
  transport: "udp-sync@127.0.0.1:6667-127.0.0.1:6666"
  protocol: "h4"
  timeout: 2500
  initial_timeout: 60000
  max_att_profile_guided_probe_steps: 12
  supported_states: [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF]
  legacy_scan_reports:
    - event_type: 0x00
      address_type: "Public"
      address: [0xA1, 0xA2, 0xA3, 0xA4, 0xA5, 0xA6]
      data: [0x0D, 0x09, 0x4E, 0x49, 0x4D, 0x42, 0x4C, 0x45, 0x5F, 0x42, 0x4C, 0x45, 0x5F, 0x47]
      rssi: -46
  ablation:
    record_telemetry: true
    telemetry_dir: "./telemetry"

executor:
  flash_path: "./qemu_flash.bin"
  efuse_path: "../common/efuse.bin"
  pc_bios_path: "../common"
  hooks:
    controller:
      esp_bt_controller_init: 0x400E6BCC
      esp_bt_controller_enable: 0x400E6D94
      esp_bt_controller_get_status: 0x00000000
      esp_bt_controller_mem_release: 0x400E6B88
      esp_ble_tx_power_get: 0x00000000
      esp_vhci_host_register_callback: 0x400E6B78
      esp_vhci_host_check_send_available: 0x400E6B50
      esp_vhci_host_send_packet: 0x400E6B5C
    sanitizer:
      malloc_enter: 0x4008F61C
      malloc_return: 0x4008F626
      pv_port_malloc_enter: 0x400D470C
      pv_port_malloc_return: 0x400D471B
      free_enter: 0x4008F63C
      v_port_free_enter: 0x400D4720
      calloc_enter: 0x4008F648
      calloc_return: 0x4008F672
      panic_handler: 0x400817B0
      esp_panic_handler: 0x40115DBC
      heap_area:
        - [0x3FFAFF10, 0x000000F0]
        - [0x3FFB6388, 0x00001C78]
        - [0x3FFB9A20, 0x00004108]
        - [0x3FFC6D38, 0x000192C8]
        - [0x3FFE0440, 0x00003AE0]
        - [0x3FFE4350, 0x0001BCB0]
        - [0x40097800, 0x00008800]
      code_area: []
