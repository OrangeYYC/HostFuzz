[workspace]
resolver = "2"
members = [
    "crates/ble",    
    "crates/fuzzer",
    "crates/simulator",
]
exclude = [
    "apps/",
    "deps/libafl",
]

[workspace.package]
version = "0.16.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AFLplusplus/LibAFL/"
readme = "./README.md"

[workspace.dependencies]
# Workspace
ble = { path = "./crates/ble" }
simulator = { path = "crates/simulator" }
fuzzer = { path = "./crates/fuzzer" }

# Internal deps
btuuid = "0.1.0"
anyhow = "1.0"
hex = "0.4"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "std"] }
spin = { version = "0.10.0", default-features = false, features = ["lazy"] }
tempfile = "3"
chrono = "0.4"
aes = "0.8"
cipher = "0.4"

# LibAFL deps
build_id2 = { path = "./deps/libafl/crates/build_id2", version = "0.16.0", default-features = false }
core_affinity2 = { path = "./deps/libafl/crates/core_affinity2", version = "0.16.0", default-features = false }
exceptional = { path = "./deps/libafl/crates/exceptional", version = "0.16.0", default-features = false }
fast_rands = { path = "./deps/libafl/crates/fast_rands", version = "0.16.0", default-features = false }
libafl = { path = "./deps/libafl/crates/libafl", version = "0.16.0", default-features = false }
libafl_bolts = { path = "./deps/libafl/crates/libafl_bolts", version = "0.16.0", default-features = false, features = ["serdeany_autoreg"] }
libafl_cc = { path = "./deps/libafl/crates/libafl_cc", version = "0.16.0", default-features = false }
libafl_core = { path = "./deps/libafl/crates/libafl_core", version = "0.16.0", default-features = false }
libafl_derive = { path = "./deps/libafl/crates/libafl_derive", version = "0.16.0", default-features = false }
libafl_frida = { path = "./deps/libafl/crates/libafl_frida", version = "0.16.0", default-features = false }
libafl_intelpt = { path = "./deps/libafl/crates/libafl_intelpt", version = "0.16.0", default-features = false }
libafl_libfuzzer = { path = "./deps/libafl/crates/libafl_libfuzzer", version = "0.16.0", default-features = false }
libafl_nyx = { path = "./deps/libafl/crates/libafl_nyx", version = "0.16.0", default-features = false }
libafl_qemu = { path = "./deps/libafl/crates/libafl_qemu", version = "0.16.0", default-features = false }
libafl_qemu_build = { path = "./deps/libafl/crates/libafl_qemu/libafl_qemu_build", version = "0.16.0", default-features = false }
libafl_qemu_sys = { path = "./deps/libafl/crates/libafl_qemu/libafl_qemu_sys", version = "0.16.0", default-features = false }
libafl_sugar = { path = "./deps/libafl/crates/libafl_sugar", version = "0.16.0", default-features = false }
libafl_targets = { path = "./deps/libafl/crates/libafl_targets", version = "0.16.0", default-features = false }
libafl_tinyinst = { path = "./deps/libafl/crates/libafl_tinyinst", version = "0.16.0", default-features = false }
ll_mp = { path = "./deps/libafl/crates/ll_mp", version = "0.16.0", default-features = false }
minibsod = { path = "./deps/libafl/crates/minibsod", version = "0.16.0", default-features = false }
no_std_time = { path = "./deps/libafl/crates/no_std_time", version = "0.16.0", default-features = false }
ownedref = { path = "./deps/libafl/crates/ownedref", version = "0.16.0", default-features = false }
serde_anymap = { path = "./deps/libafl/crates/serde_anymap", version = "0.16.0", default-features = false }
shmem_providers = { path = "./deps/libafl/crates/shmem_providers", version = "0.16.0", default-features = false }
tuple_list_ex = { path = "./deps/libafl/crates/tuple_list_ex", version = "0.16.0", default-features = false }

# External deps
ahash = { version = "0.8.12", default-features = false } # The hash function already used in hashbrown
arbitrary-int = "2.0.0" # arbitrary sized integers, useful in combination with bitfields (bitbybit crate)
backtrace = { version = "0.3.74", default-features = false } # Used to get the stacktrace in StacktraceObserver
bindgen = "0.72.1"
bitbybit = "1.4.0" # bitfields, use this for bit fields and bit enums
capstone = "0.13.0" # Disassembler used in libafl_unicorn to provide disassembly on crash
clap = "4.5.52"
cc = "1.2.49"
cmake = "0.1.54"
ctor = "0.6.3"
document-features = "0.2.11"
erased-serde = { version = "0.4.5", default-features = false } # erased serde
fastbloom = { version = "0.14.0", default-features = false }
fs2 = "0.4.3" # Used by OnDisk Corpus for file locking
hashbrown = { version = "0.16.1", default-features = false } # A faster hashmap, nostd compatible
just = "1.44.1"
libc = "0.2.178" # For (*nix) libc
libipt = { version = "0.4.0", features = ["libipt_master"] }
libvharness_sys = { path = "./deps/libafl/crates/libafl_qemu/libvharness_sys", version = "0.16.0", default-features = false }
log = "0.4.29"
meminterval = "0.4.2"
mimalloc = { version = "0.1.48", default-features = false }
nix = { version = "0.30.1", default-features = false, features = ["process"] }
num_enum = { version = "0.7.4", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
paste = "1.0.15"
postcard = { version = "1.1.3", features = [
  "alloc",
], default-features = false } # no_std compatible serde serialization format
pyo3 = { version = "0.26.0", features = ["auto-initialize"] }
pyo3-build-config = "0.27.2"
rangemap = "1.7.0"
regex = "1.12.2"
rustversion = "1.0.22"
serde = { version = "1.0.228", default-features = false } # serialization lib
serde_json = { version = "1.0.145", default-features = false }
serde_yaml = { version = "0.9.34" } # For parsing the injections yaml file
serial_test = { version = "3.2.0", default-features = false }
static_assertions = "1.1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
tinyinst = "0.1.1"
toml = "0.9.7" # For parsing the injections toml file
tuple_list = { version = "0.1.3" }
typed-builder = "0.23.2" # Implement the builder pattern at compiletime
typeid = "1.0.3" # Safe type_eq that doesn't rely on std specialization
unicorn-engine = "2.0.1" # Used in libafl_unicorn
uuid = { version = "1.19.0", features = ["serde", "v4"] }
which = "8.0.0"
windows = "0.62.1"
windows-core = "0.62.1"
z3 = { version = "0.19.5", default-features = false }

[workspace.lints.rust]
# Deny
warnings = { level = "deny", priority = -1 }

# Forbid
unexpected_cfgs = "forbid"

# Allow
incomplete_features = "allow"
# ambiguous_glob_reexports = "allow"


[workspace.lints.clippy]
# Deny
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo_common_metadata = "deny"

alloc_instead_of_core = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"

# Warn
cargo = { level = "warn", priority = -1 }

# Allow
cast_possible_truncation = "allow"
comparison_chain = "allow"          # This lint makes **ZERO** sense
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"   # TODO: turn into `warn` when working
negative_feature_names = "allow"    # TODO: turn into 'warn' when working
ptr_as_ptr = "allow"
similar_names = "allow"
struct_field_names = "allow"        # ????
too_many_lines = "allow"
type_repetition_in_bounds = "allow"
unreadable_literal = "allow"
unsafe_derive_deserialize = "allow"
used_underscore_binding = "allow"

[workspace.lints.rustdoc]
# Deny
broken_intra_doc_links = "deny"


[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
