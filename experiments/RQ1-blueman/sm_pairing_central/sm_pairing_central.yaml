fuzzer:
  work_dir: "./fuzz"

simulator:
  transport: "zephyr_ipc@sim=trial_sim,dev=0,phy=HCIIPC,mode=hci_ipc"
  protocol: "h4"
  timeout: 3000
  initial_timeout: 3000
  round_timeout: 0
  max_acl_packets_per_round: 256
  legacy_scan_reports:
    - event_type: 0
      address_type: Public
      address: [161, 162, 163, 164, 165, 166]
      # Flags + Incomplete list of 16-bit UUIDs: 0x1111
      data: [2, 1, 6, 3, 2, 17, 17]
      rssi: -40

executor:
  target_path: "./target.exe"
  cmd_args: ["-v=0", "-nosim", "-s=trial_sim", "-d=0"]
  auto_append_sim_args: false
  run_timeout_ms: 1500
  env: {}
  allow_nonzero_exit: true
