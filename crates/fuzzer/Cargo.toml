[package]
name = "fuzzer"
version.workspace = true
edition = "2024"

[features]
default = []
fuzzware_input = ["ble/fuzzware_input"]

[dependencies]
ble = { workspace = true }
simulator = { workspace = true }
libafl = { workspace = true, features = ["std"] }
libafl_core = { workspace = true }
libafl_bolts = { workspace = true, features = ["std", "serdeany_autoreg"] }
nix = { workspace = true, features = ["signal", "process"] }
tracing = {workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
postcard = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
