[package]
name = "esp32_fuzzer"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4"
libc = "0.2.178"
spin = { version = "0.10.0", default-features = false, features = ["lazy"] }
serde = { version = "1.0.228" }
serde_yaml = { version = "0.9.34" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "std"] }
clap = { version = "4.5.52", features = ["derive"] }
ble = { path = "../../crates/ble" }
fuzzer = { path = "../../crates/fuzzer" }
simulator = { path = "../../crates/simulator" }
libafl = { path = "../../deps/libafl/crates/libafl" }
libafl_bolts = { path = "../../deps/libafl/crates/libafl_bolts" }
libafl_qemu = { path = "../../deps/libafl/crates/libafl_qemu", default-features = false, features = ["systemmode", "xtensa"] }

[workspace]
members = ["."]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true