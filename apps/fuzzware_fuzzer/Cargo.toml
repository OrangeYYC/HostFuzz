[package]
name = "fuzzware_fuzzer"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.178"
serde = { version = "1.0.228" }
serde_yaml = { version = "0.9.34" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "std"] }
clap = { version = "4.5.52", features = ["derive"] }
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }
ble = { path = "../../crates/ble", features = ["fuzzware_input"] }
fuzzer = { path = "../../crates/fuzzer", features = ["fuzzware_input"] }
simulator = { path = "../../crates/simulator" }
libafl = { path = "../../deps/libafl/crates/libafl" }
libafl_bolts = { path = "../../deps/libafl/crates/libafl_bolts" }

[workspace]
members = ["."]
